server:
  port: 9096

spring:
  application:
    name: FitnessClub

  datasource:
  url: jdbc:postgresql://localhost5432/fitness_club
  username: root
  password: root

  driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true


